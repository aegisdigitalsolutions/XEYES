# The Xcode project is generated from this file by XcodeGen, and the generated .xcodeproj is
# committed alongside it.
#
# Both, because each alone has a cost. A hand-maintained project.pbxproj is a 30,000-line file full
# of hex identifiers that cannot be reviewed and conflicts on every branch that adds a source file.
# A generated-only project means nobody can open the repository in Xcode without first installing a
# tool. So this file is the thing to edit and to review, and the project file is a build artifact
# that happens to be committed for convenience.
#
#     brew install xcodegen
#     cd ios && xcodegen generate
#
# The core logic is not in this project. It lives in Packages/RFMapper, referenced below as a local
# Swift package, because the parts that have to agree with Kotlin byte-for-byte are tested on Linux
# where no Xcode exists:
#
#     cd ios/Packages/RFMapper && swift test

name: RFMapperCollector

options:
  bundleIdPrefix: com.rfmapper
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    # 16, not 17, so a cheap second-hand handset -- an iPhone 8 or X, which cannot go past 16 -- is
    # still usable as a survey device. The cost is that ContentUnavailableView and the other iOS 17
    # conveniences are off the table.
    iOS: "16.0"

packages:
  RFMapper:
    path: Packages/RFMapper

settings:
  base:
    # One place for the version that ends up in CFBundleShortVersionString, in every observation's
    # metadata.app_version, and in every package manifest's generator block.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: en
    # Signing lives in Config/Signing.xcconfig, not here. Build settings declared at this level
    # override a target's xcconfig, so putting CODE_SIGN_STYLE or DEVELOPMENT_TEAM here would make
    # the local override file silently ineffective.
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

targets:
  RFMapperCollector:
    type: application
    platform: iOS
    sources:
      - path: RFMapperCollector
        excludes:
          # Consumed as build settings rather than copied into the bundle. Listed again below so
          # they are still visible and editable in Xcode's navigator.
          - Info.plist
          - RFMapperCollector.entitlements
      - path: RFMapperCollector/Info.plist
        buildPhase: none
      - path: RFMapperCollector/RFMapperCollector.entitlements
        buildPhase: none
    dependencies:
      - package: RFMapper
        product: RFMapperCore
      - package: RFMapper
        product: RFMapperCollectorKit
    # PRODUCT_BUNDLE_IDENTIFIER, DEVELOPMENT_TEAM and CODE_SIGN_STYLE come from here, and are
    # deliberately absent from `settings` below: a target setting beats its own xcconfig, so
    # repeating them would defeat the local override the xcconfig exists to allow.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        # PRODUCT_NAME is deliberately left as the target name. Overriding it renames the built
        # product without renaming the scheme's BuildableName, and the home-screen name comes from
        # CFBundleDisplayName anyway.
        INFOPLIST_FILE: RFMapperCollector/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: RFMapperCollector/RFMapperCollector.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone and iPad: an iPad is a legitimate survey device and ObserverDeviceType has a value
        # for it, so the observer it declares is not a lie about what recorded the data.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # There is no supported way to scan Wi-Fi or range BLE on a simulator, and a package
        # exported from one would contain no radio observations at all. The project still builds for
        # the simulator, which is what makes the interface iterable; the data cannot come from one.
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"

schemes:
  RFMapperCollector:
    build:
      targets:
        RFMapperCollector: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
