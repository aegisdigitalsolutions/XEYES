org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
ksp.incremental=true

# The build targets JDK 17 regardless of the JDK that launches Gradle. A machine whose only JDK is
# a different major version should point Gradle at a 17 installation from a *local*, uncommitted
# properties file, for example in ~/.gradle/gradle.properties:
#
#   org.gradle.java.installations.paths=/opt/jdk-17
org.gradle.java.installations.auto-detect=true
