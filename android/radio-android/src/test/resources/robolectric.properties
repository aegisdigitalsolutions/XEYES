# Without this, Robolectric infers the SDK from the library manifest's minSdk (26) and the whole
# permission matrix would be exercised only on the oldest API this app supports — where
# ACCESS_BACKGROUND_LOCATION, BLUETOOTH_SCAN and NEARBY_WIFI_DEVICES do not yet exist. The default
# is therefore a current API, and the tests that assert older behaviour pin their own level with
# @Config(sdk = ...).
sdk=34
